<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny AI Suite</title>

    <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">

    <link rel="stylesheet" href="/static/css/inter.css">
    <link rel="stylesheet" href="/static/css/google-sans.css">
    <link rel="stylesheet" href="/static/css/jetbrains-mono.css">
    <link rel="stylesheet" href="/static/css/github-dark.min.css">

    <script src="/static/js/lucide.min.js"></script>
    <script src="/static/js/marked.umd.js"></script>
    <script src="/static/js/highlight.min.js"></script>
    <script src="/static/js/tailwind.js"></script>
    <style>
      :root {
        --ctp-rosewater: #f5e0dc; --ctp-flamingo: #f2cdcd; --ctp-pink: #f5c2e7;
        --ctp-mauve: #cba6f7;     --ctp-red: #f38ba8;      --ctp-maroon: #eba0ac;
        --ctp-peach: #fab387;     --ctp-yellow: #f9e2af;   --ctp-green: #a6e3a1;
        --ctp-teal: #94e2d5;      --ctp-sky: #89dceb;      --ctp-sapphire: #74c7ec;
        --ctp-blue: #89b4fa;      --ctp-lavender: #b4befe; --ctp-text: #cdd6f4;
        --ctp-subtext1: #bac2de;  --ctp-subtext0: #a6adc8; --ctp-overlay2: #9399b2;
        --ctp-overlay1: #7f849c;  --ctp-overlay0: #6c7086; --ctp-surface2: #585b70;
        --ctp-surface1: #45475a;  --ctp-surface0: #313244; --ctp-base: #1e1e2e;
        --ctp-mantle: #181825;    --ctp-crust: #11111b;
      }
    </style>
    <style type="text/tailwindcss">
      @theme {
        --color-rosewater: var(--ctp-rosewater); --color-flamingo: var(--ctp-flamingo);
        --color-pink: var(--ctp-pink);           --color-mauve: var(--ctp-mauve);
        --color-red: var(--ctp-red);             --color-maroon: var(--ctp-maroon);
        --color-peach: var(--ctp-peach);         --color-yellow: var(--ctp-yellow);
        --color-green: var(--ctp-green);         --color-teal: var(--ctp-teal);
        --color-sky: var(--ctp-sky);             --color-sapphire: var(--ctp-sapphire);
        --color-blue: var(--ctp-blue);           --color-lavender: var(--ctp-lavender);
        --color-text: var(--ctp-text);           --color-subtext1: var(--ctp-subtext1);
        --color-subtext0: var(--ctp-subtext0);   --color-overlay2: var(--ctp-overlay2);
        --color-overlay1: var(--ctp-overlay1);   --color-overlay0: var(--ctp-overlay0);
        --color-surface2: var(--ctp-surface2);   --color-surface1: var(--ctp-surface1);
        --color-surface0: var(--ctp-surface0);   --color-base: var(--ctp-base);
        --color-mantle: var(--ctp-mantle);       --color-crust: var(--ctp-crust);

        --font-sans: 'Inter', sans-serif;
        --font-display: 'Google Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
    </style>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--ctp-crust); }
      ::-webkit-scrollbar-thumb { background: var(--ctp-surface0); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--ctp-surface1); }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: var(--ctp-surface0);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -5px;
        border-radius: 999px;
        background: var(--ctp-mauve);
        border: 2px solid var(--ctp-base);
      }
      input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: var(--ctp-surface0);
      }
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 2px solid var(--ctp-base);
        border-radius: 999px;
        background: var(--ctp-mauve);
      }
      input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--ctp-lavender); }
      input[type="range"]:focus-visible::-moz-range-thumb { outline: 2px solid var(--ctp-lavender); }

      @keyframes bar-sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(420%); }
      }
      .bar-indeterminate {
        width: 24%;
        animation: bar-sweep 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      audio { width: 100%; height: 38px; }
      audio::-webkit-media-controls-panel { background-color: var(--ctp-surface0); }

      .markdown-body {
        background-color: transparent !important;
        font-family: 'Inter', sans-serif !important;
        color: var(--ctp-subtext0) !important;
        line-height: 1.6;
        font-size: 15px;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
        padding-bottom: 0.3em;
      }
      .markdown-body h1 { font-size: 2em;     color: var(--ctp-lavender) !important; border-bottom: 1px solid var(--ctp-surface0); }
      .markdown-body h2 { font-size: 1.5em;   color: var(--ctp-mauve) !important; border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface0) 50%, transparent); }
      .markdown-body h3 { font-size: 1.25em;  color: var(--ctp-blue) !important; }
      .markdown-body h4 { font-size: 1em;     color: var(--ctp-text); font-weight: 600; }
      .markdown-body h5 { font-size: 0.875em; color: var(--ctp-text); font-weight: 600; }
      .markdown-body h6 { font-size: 0.85em;  color: var(--ctp-subtext0); }

      .markdown-body p { margin-bottom: 16px; }
      .markdown-body a { color: var(--ctp-blue); text-decoration: none; }
      .markdown-body a:hover { text-decoration: underline; }

      .markdown-body ul, .markdown-body ol { padding-left: 2em; margin-bottom: 16px; }
      .markdown-body ul { list-style-type: disc; }
      .markdown-body ol { list-style-type: decimal; }
      .markdown-body li { margin-bottom: 0.25em; }

      .markdown-body code {
        font-family: 'JetBrains Mono', monospace;
        color: var(--ctp-peach) !important;
        background-color: var(--ctp-surface0) !important;
        border-radius: 4px;
        padding: 0.2em 0.4em;
        font-size: 0.9375em;
      }
      .markdown-body pre {
        position: relative;
        background-color: var(--ctp-base) !important;
        border-radius: 0.75rem;
        padding: 1rem !important;
        margin-bottom: 16px;
        overflow: auto;
      }
      .markdown-body pre code {
        color: inherit !important;
        background-color: transparent !important;
        padding: 0;
        font-size: 0.9375em;
      }

      .markdown-body table {
        display: table !important;
        width: 100% !important;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid color-mix(in oklab, var(--ctp-surface1) 50%, transparent);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 1.5rem;
      }
      .markdown-body table thead { background-color: color-mix(in oklab, var(--ctp-mauve) 10%, transparent); }
      .markdown-body table tr { background-color: transparent !important; border: none !important; }
      .markdown-body table tr:nth-child(2n) { background-color: color-mix(in oklab, var(--ctp-surface0) 30%, transparent) !important; }
      .markdown-body table th {
        color: var(--ctp-mauve) !important;
        font-weight: 600;
        border: none !important;
        border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface1) 50%, transparent) !important;
        border-right: 1px solid color-mix(in oklab, var(--ctp-surface0) 50%, transparent);
        padding: 12px 16px !important;
        text-align: left;
      }
      .markdown-body table td {
        border: none !important;
        border-bottom: 1px solid color-mix(in oklab, var(--ctp-surface0) 30%, transparent) !important;
        border-right: 1px solid color-mix(in oklab, var(--ctp-surface0) 30%, transparent);
        color: var(--ctp-subtext0) !important;
        padding: 12px 16px !important;
        text-align: left;
      }
      .markdown-body table th:last-child, .markdown-body table td:last-child { border-right: none; }
      .markdown-body table tr:last-child td { border-bottom: none !important; }

      .markdown-body blockquote {
        border-left: 0.25em solid color-mix(in oklab, var(--ctp-surface1) 50%, transparent);
        padding: 0 1em;
        color: var(--ctp-subtext0);
        margin-bottom: 16px;
      }
      .markdown-body hr { border: none; border-top: 1px solid var(--ctp-surface0); margin: 1.5em 0; }
      .markdown-body img { max-width: 100%; }
      .markdown-body > :first-child { margin-top: 0; }
      .markdown-body > :last-child { margin-bottom: 0; }

      .copy-code-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.5rem;
        background-color: color-mix(in oklab, var(--ctp-surface0) 95%, transparent);
        border-radius: 0.375rem;
        color: var(--ctp-subtext0);
        cursor: pointer;
        opacity: 0;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      pre:hover .copy-code-btn { opacity: 1; }
      .copy-code-btn:hover { background-color: var(--ctp-surface1); color: var(--ctp-mauve); }
      .copy-code-btn.copied { color: var(--ctp-green); }

      .callout {
        padding: 1rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        display: flex;
        gap: 0.75rem;
        align-items: flex-start;
        background-color: color-mix(in oklab, var(--ctp-surface0) 20%, transparent);
      }
      .callout-icon {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
        line-height: 1;
        padding-top: 0.3em;
      }
      .callout-icon svg { width: 1em; height: 1em; }
      .callout-content { flex: 1; }
      .callout-content p { margin: 0 !important; }

      .callout.tip     { background-color: color-mix(in oklab, var(--ctp-green) 10%, transparent); }
      .callout.tip     .callout-icon { color: var(--ctp-green); }
      .callout.info    { background-color: color-mix(in oklab, var(--ctp-blue) 10%, transparent); }
      .callout.info    .callout-icon { color: var(--ctp-blue); }
      .callout.danger  { background-color: color-mix(in oklab, var(--ctp-red) 10%, transparent); }
      .callout.danger  .callout-icon { color: var(--ctp-red); }
      .callout.warning { background-color: color-mix(in oklab, var(--ctp-peach) 10%, transparent); }
      .callout.warning .callout-icon { color: var(--ctp-peach); }
      .callout.note    { background-color: color-mix(in oklab, var(--ctp-mauve) 10%, transparent); }
      .callout.note    .callout-icon { color: var(--ctp-mauve); }
    </style>
</head>
<body class="bg-crust text-subtext0 min-h-screen font-sans antialiased">
    <nav class="bg-mantle px-6 py-3 sticky top-0 z-30">
        <div class="flex items-center justify-between gap-4">
            <a href="#/" class="flex items-center gap-2.5 min-w-0 shrink-0">
                <img src="/static/icons/logo.png" alt="" class="w-8 h-8 rounded-lg shrink-0">
                <span class="text-lg font-semibold font-display truncate text-text">Tiny AI Suite</span>
            </a>
            <div class="flex min-w-0 flex-1 items-center justify-end gap-2">
                <label id="search-box" class="relative flex min-w-0 flex-1 items-center sm:max-w-xs lg:max-w-sm">
                    <i data-lucide="search" class="pointer-events-none absolute left-3 h-4 w-4 text-overlay0"></i>
                    <input id="task-search" type="search" autocomplete="off" placeholder="Search tasks"
                           class="w-full rounded-lg bg-surface0/70 py-1.5 pl-9 pr-3 text-sm text-text placeholder:text-overlay0 focus:outline-none focus:ring-1 focus:ring-mauve/60">
                </label>
                <button id="sidebar-toggle" type="button" title="Recent jobs"
                        class="lg:hidden inline-flex shrink-0 items-center gap-2 rounded-lg bg-surface0 px-3 py-1.5 text-sm text-subtext1 hover:bg-surface1">
                    <i data-lucide="history" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Jobs</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="flex flex-col lg:flex-row gap-6 px-6 py-6">
        <main class="flex-1 min-w-0">
            <section id="view-launcher"></section>
            <section id="view-form" class="hidden"></section>
            <section id="view-job" class="hidden"></section>
        </main>

        <aside id="sidebar" class="hidden lg:block lg:w-72 shrink-0 lg:sticky lg:top-20 lg:self-start">
            <div class="bg-mantle rounded-xl overflow-hidden">
                <div class="flex items-center justify-between px-4 py-3">
                    <h2 class="text-sm font-semibold font-display text-text">Recent jobs</h2>
                    <button id="jobs-refresh" type="button" title="Refresh"
                            class="text-overlay1 hover:text-text">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="jobs-list" class="max-h-[70vh] overflow-y-auto pb-2"></div>
            </div>
        </aside>
    </div>

    <div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

    <script src="/static/util.js"></script>
    <script src="/static/markdown.js"></script>
    <script src="/static/widgets.js"></script>
    <script src="/static/task-form.js"></script>
    <script src="/static/dictation.js"></script>
    <script src="/static/chat.js"></script>
    <script src="/static/job-view.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
