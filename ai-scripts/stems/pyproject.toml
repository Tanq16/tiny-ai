[project]
name = "stems"
version = "0.1.0"
description = "Splits a track into instrument stems."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tinyai-common",
    "numpy>=2",
    "torch>=2.6",
    "music-source-separation-training[bs-roformer]",
]

[project.scripts]
stems = "stems:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tinyai-common = { path = "../common", editable = true }
music-source-separation-training = { git = "https://github.com/ZFTurbo/Music-Source-Separation-Training", rev = "v1.0.22" }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
