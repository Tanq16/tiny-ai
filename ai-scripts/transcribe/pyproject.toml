[project]
name = "transcribe"
version = "0.1.0"
description = "Transcribes speech to text, SRT and JSON with MLX Whisper."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tinyai-common",
    "mlx-whisper>=0.4.3",
]

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tinyai-common = { path = "../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
