[project]
name = "dictate"
version = "0.1.0"
description = "Transcribes a dictation with Qwen3-ASR and polishes it with a local Gemma."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tinyai-common",
    "mlx-qwen3-asr>=0.3.5",
    "mlx-vlm>=0.6.15",
    "jinja2>=3.1.6",
]

[project.scripts]
dictate = "dictate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tinyai-common = { path = "../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
