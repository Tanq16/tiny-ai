[project]
name = "chat"
version = "0.1.0"
description = "Holds a multi-turn conversation with a local Gemma through MLX, taking text, images and audio."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tinyai-common",
    "mlx-vlm>=0.6.15",
    "jinja2>=3.1.6",
    "pillow>=10.2",
]

[project.scripts]
chat = "chat:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tinyai-common = { path = "../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
