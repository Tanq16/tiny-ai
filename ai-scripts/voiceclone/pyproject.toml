[project]
name = "voiceclone"
version = "0.1.0"
description = "Speaks new text in a voice cloned from a short reference clip with F5-TTS."
requires-python = ">=3.12,<3.14"
dependencies = [
    "tinyai-common",
    "f5-tts-mlx>=0.2.6",
    "mlx-whisper>=0.4.3",
]

[project.scripts]
voiceclone = "voiceclone:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
tinyai-common = { path = "../common", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
