[project]
name = "tiny-ai-suite"
version = "0.1.0"
description = "Tooling environment for the tiny-ai-suite scripts; each script carries its own PEP 723 dependencies and lockfile."
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
