[project]
name = "episode-vtt"
version = "0.1.0"
description = "Extracts episode audio and writes a sibling WebVTT transcript with Qwen3-ASR."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx-qwen3-asr>=0.3.5",
]

[project.scripts]
episode-vtt = "episode_vtt:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
